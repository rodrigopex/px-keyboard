CONFIG_OBJZ=y
CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_INPUT=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_BAS=y
CONFIG_BT_DEVICE_NAME="PX-KB"
CONFIG_BT_DEVICE_APPEARANCE=961

# Bonding / settings persistence
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Crypto (required for BLE SMP)
CONFIG_MBEDTLS=y
CONFIG_PSA_CRYPTO=y

# Stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
