CONFIG_OBJZ=y
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_PRINTK=y
CONFIG_INPUT=y
CONFIG_INPUT_LONGPRESS=y

CONFIG_ZBUS=y
CONFIG_ZBUS_ASYNC_LISTENER=y
CONFIG_ZBUS_CHANNEL_NAME=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_SMP=y

# Lets -app_passkey supply the pairing passkey (see PXBLEController.m).
# The older CONFIG_BT_FIXED_PASSKEY + bt_passkey_set() is __deprecated in
# Zephyr 4.4.2, which points here instead.
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_BAS=y
CONFIG_BT_DEVICE_NAME="PX-KB"
CONFIG_BT_DEVICE_APPEARANCE=961

# Bonding / settings persistence
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Two identities, so -forgetBond can rotate the one we advertise on.
#
# bt_id_reset() refuses BT_ID_DEFAULT outright (id.c:1437), and rotating the
# identity address is the only way a host can pair again without the user
# first clicking "Forget This Device": BLE has no "unpair me" message, and a
# host that keeps a bond whose key we deleted rejects the next encryption
# attempt with PIN-or-Key-Missing instead of re-pairing. So identity 1 is the
# one in the advertisement, and identity 0 is never used.
CONFIG_BT_ID_MAX=2

# One bond per identity. The default of 1 is not enough: a stale identity-0
# bond, left in NVS by a build from before identity 1 existed, would occupy
# the only slot and leave identity 1 unable to bond at all.
CONFIG_BT_MAX_PAIRED=2

# Stack
#
# bt_enable(bt_ready) runs the callback on the system workqueue, and
# bt_ready does settings_load() (NVS, so flash) and then bt_le_adv_start().
# The default 1024 is not enough for that: it overflows into the
# CONFIG_MPU_STACK_GUARD region and faults as "Stacking error / Data Access
# Violation" right after "Bluetooth initialized", before advertising starts.
#
# Both zbus async listeners run on this queue too (chan_keys -> HID report,
# chan_keys -> gesture), though they do not nest with bt_ready -- work items
# run one at a time, so the requirement is the deepest single item, not the
# sum. Check headroom with `kernel stacks` at the shell.
# Measured 1232 of 2048 with `kernel thread stacks`, so the 1024 default
# genuinely overflows. Zephyr's own samples/bluetooth/peripheral_hids sets
# the same value with the same reason: "Increased stack due to settings API
# usage".
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096

# Measured 1248 of 2048, against a 1200 default -- so this is a requirement,
# not headroom. The connection callbacks publish chan_ble_link, and
# zbus_chan_pub allocates a net_buf and submits work per async observer.
CONFIG_BT_RX_STACK_SIZE=2048

# No CONFIG_INPUT_THREAD_STACK_SIZE here on purpose. It was raised to 2048
# on the reasoning that chan_keys has four observers and zbus_chan_pub
# allocates a net_buf per async one -- and `kernel thread stacks` then
# measured the input thread at 504 of 2048, so the 1024 default has ample
# room and the extra kilobyte bought nothing. The two that stayed are the
# two the same measurement showed were needed.

# Zview
CONFIG_INIT_STACKS=y            # Required for stack watermarks
CONFIG_THREAD_MONITOR=y         # Required for thread discovery
CONFIG_THREAD_STACK_INFO=y      # Required for thread metadata

CONFIG_THREAD_NAME=y            # Enables thread name display
CONFIG_THREAD_RUNTIME_STATS=y   # Enables CPU usage tracking
CONFIG_SYS_HEAP_RUNTIME_STATS=y # Enables heap runtime stats

CONFIG_DEBUG=y
CONFIG_ASSERT=y

CONFIG_SHELL=y
